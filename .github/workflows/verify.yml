name: Verify QueryLab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  accounts:
    name: Google account client and private statistics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QUERYLAB_BASE_PATH: /querylab/
      VITE_SUPABASE_URL: https://querylab-auth.test
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_querylab_browser_test
      QUERYLAB_ACCOUNTS_WITH_HELPER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            qa/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Progress and public configuration unit tests
        run: node --experimental-strip-types --test frontend/tests/progress.test.mjs
      - name: Verify actual PostgreSQL row security and aggregates
        run: node scripts/test-progress-database.mjs
      - name: Build configured account client
        run: npm run build:helper
        working-directory: frontend
      - name: Create private disposable helper configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import secrets
          content = Path('helper.env.example').read_text()
          for old, new in {
              'generate-a-local-pairing-code': secrets.token_hex(32),
              'generate-a-local-namespace': secrets.token_hex(6),
              'replace-with-your-local-mysql-password': secrets.token_hex(32),
          }.items():
              content = content.replace(old, new)
          Path('.env.helper').write_text(content)
          PY
      - name: Start the real local helper and MySQL
        run: docker compose --env-file .env.helper -f compose.helper.yaml --profile bundled up --build -d --wait --wait-timeout 180
      - name: Wait for MySQL compatibility readiness
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          for attempt in range(60):
              with urllib.request.urlopen('http://127.0.0.1:8765/api/helper/status', timeout=10) as response:
                  if json.load(response)['database']['connected']:
                      break
              time.sleep(2)
          else:
              raise SystemExit('Local practice database did not become ready')
          PY
      - name: Install browser test tooling
        working-directory: qa
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Controlled OAuth and REST responses with real SQL grading
        run: npx playwright test --config playwright.accounts.config.js
        working-directory: qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accounts-test-evidence
          path: |
            qa/accounts-test-results.json
            qa/screenshots/accounts/
          if-no-files-found: ignore
      - name: Stop disposable helper services
        if: always()
        run: docker compose --env-file .env.helper -f compose.helper.yaml --profile bundled down --volumes

  pages:
    name: Static Pages build (${{ matrix.base-path }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        base-path: ['/', '/querylab/']
    env:
      QUERYLAB_BASE_PATH: ${{ matrix.base-path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            qa/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build static helper-mode website
        run: npm run build:helper
        working-directory: frontend
      - name: Verify the packaged helper
        run: python3 scripts/verify-helper-package.py
      - name: Install browser test tooling
        working-directory: qa
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check downloads, navigation and refresh
        run: npx playwright test --config playwright.pages.config.js --grep "static Pages build"
        working-directory: qa

  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Package the standalone Windows helper
        run: node scripts/package-helper.mjs
      - name: Launcher prerequisite and recovery checks
        shell: powershell
        run: ./scripts/test-helper-launcher.ps1
      - name: Construct the native setup window
        shell: powershell
        run: ./distribution/windows/launch-helper.ps1 -ValidateUI
      - uses: actions/upload-artifact@v4
        with:
          name: windows-helper-download
          path: frontend/public/downloads/

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            qa/package-lock.json
      - name: Create disposable environment
        shell: bash
        run: |
          cp .env.example .env
          python3 - <<'PY'
          from pathlib import Path
          import secrets
          path = Path('.env')
          path.write_text(path.read_text().replace('replace-with-a-long-random-local-password', secrets.token_hex(32)))
          PY
      - name: Build and start real MySQL stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Backend unit and MySQL integration checks
        run: docker compose run --rm --no-deps -e PYTHONPATH=/app -e QUERYLAB_INTEGRATION=1 -v "$PWD/backend:/app:ro" backend python -m pytest tests -q -p no:cacheprovider
      - name: Install API test runner
        working-directory: qa
        run: npm ci
      - name: API learning loop and execution safety checks
        working-directory: qa
        run: npm run test:api
      - name: Container diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-evidence
          path: |
            qa/test-results.json
            qa/test-artifacts/
          if-no-files-found: ignore
      - name: Stop disposable services
        if: always()
        run: docker compose down

  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qa/package-lock.json
      - name: Create private disposable helper configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import secrets
          content = Path('helper.env.example').read_text()
          replacements = {
              'generate-a-local-pairing-code': secrets.token_hex(32),
              'generate-a-local-namespace': secrets.token_hex(6),
              'replace-with-your-local-mysql-password': secrets.token_hex(32),
          }
          for old, new in replacements.items():
              content = content.replace(old, new)
          Path('.env.helper').write_text(content)
          PY
      - name: Build static website and local helper with real MySQL
        run: docker compose --env-file .env.helper -f compose.helper.yaml --profile bundled --profile preview up --build -d --wait --wait-timeout 180
      - name: Wait for database compatibility readiness
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          for attempt in range(60):
              with urllib.request.urlopen('http://127.0.0.1:8765/api/helper/status', timeout=10) as response:
                  if json.load(response)['database']['connected']:
                      break
              time.sleep(2)
          else:
              raise SystemExit('Local practice database did not become ready')
          PY
      - name: Verify standalone Windows download and credential exclusion
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, zipfile, urllib.request
          from pathlib import Path
          base = 'http://127.0.0.1:8081/downloads/'
          manifest = json.load(urllib.request.urlopen(base + 'querylab-helper-windows.json'))
          payload = urllib.request.urlopen(base + manifest['filename']).read()
          assert len(payload) == manifest['bytes']
          assert hashlib.sha256(payload).hexdigest() == manifest['sha256']
          downloads = Path('frontend/public/downloads')
          downloads.mkdir(parents=True, exist_ok=True)
          (downloads / 'querylab-helper-windows.zip').write_bytes(payload)
          with zipfile.ZipFile(io.BytesIO(payload)) as package:
              assert package.testzip() is None
              names = package.namelist()
              assert 'QueryLab-Helper/Start-QueryLab-Helper.cmd' in names
              assert 'QueryLab-Helper/scripts/launch-helper.ps1' in names
              assert all(name.startswith('QueryLab-Helper/') and '..' not in name.split('/') for name in names)
              assert not any(name.endswith('.env.helper') or '/.git/' in name for name in names)
              contents = b'\n'.join(package.read(name) for name in names)
              config = dict(line.split('=', 1) for line in Path('.env.helper').read_text().splitlines() if '=' in line and not line.startswith('#'))
              for key in ('QUERYLAB_PAIRING_TOKEN', 'MYSQL_ROOT_PASSWORD'):
                  assert config[key].encode() not in contents
          print('Standalone download integrity and credential exclusion passed.')
          PY
      - name: Grade all twelve challenges from the extracted download
        run: docker compose --env-file .env.helper -f compose.helper.yaml run --rm --no-deps -e QUERYLAB_WORKSPACE_NAMESPACE=aa6600000006 -v "$PWD:/workspace:ro" -w /tmp helper python /workspace/scripts/test-packaged-curriculum.py
      - name: Install browser test tooling
        working-directory: qa
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Pairing, SQL, grading, exports and recovery
        working-directory: qa
        run: npx playwright test --config playwright.helper.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helper-test-evidence
          path: |
            qa/helper-test-results.json
            qa/screenshots/helper/
          if-no-files-found: ignore
      - name: Stop disposable helper services
        if: always()
        run: docker compose --env-file .env.helper -f compose.helper.yaml --profile bundled --profile preview down

