name: querylab-helper

services:
  mysql:
    profiles: [bundled]
    image: mysql:8.4.9
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/setup-helper.ps1 first}
      MYSQL_ROOT_HOST: "%"
    command:
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION,ONLY_FULL_GROUP_BY
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --local-infile=OFF
      - --max-connections=80
      - --max-allowed-packet=4M
      - --innodb-buffer-pool-size=256M
      - --log-bin-trust-function-creators=ON
    volumes:
      - helper_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    restart: unless-stopped
    networks: [local]

  helper:
    build: ./backend
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_ROOT_USER: ${MYSQL_ROOT_USER:-root}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure the local MySQL connection}
      QUERYLAB_HELPER_MODE: "true"
      QUERYLAB_PAIRING_TOKEN: ${QUERYLAB_PAIRING_TOKEN:?Run scripts/setup-helper.ps1 first}
      QUERYLAB_WORKSPACE_NAMESPACE: ${QUERYLAB_WORKSPACE_NAMESPACE:?Run scripts/setup-helper.ps1 first}
      QUERYLAB_HELPER_ALLOWED_ORIGINS: ${QUERYLAB_HELPER_ALLOWED_ORIGINS:?Set the trusted website origins}
      QUERYLAB_SESSION_TTL_SECONDS: ${QUERYLAB_SESSION_TTL_SECONDS:-3600}
      QUERYLAB_MAX_SESSIONS: ${QUERYLAB_MAX_SESSIONS:-10}
      QUERYLAB_SQL_TIMEOUT_SECONDS: ${QUERYLAB_SQL_TIMEOUT_SECONDS:-8}
    ports:
      - "127.0.0.1:${QUERYLAB_HELPER_PORT:-8765}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/helper/status', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped
    networks: [local]

  website:
    profiles: [preview]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        QUERYLAB_FRONTEND_MODE: helper
        NGINX_CONFIG: nginx.helper.conf
    ports:
      - "127.0.0.1:${QUERYLAB_HELPER_PREVIEW_PORT:-8081}:80"
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    networks: [local]

networks:
  local:

volumes:
  helper_mysql:

