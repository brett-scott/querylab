name: querylab

services:
  mysql:
    image: mysql:8.4.9
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/setup.ps1 first}
      MYSQL_ROOT_HOST: "%"
    command:
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION,ONLY_FULL_GROUP_BY
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --local-infile=OFF
      - --max-connections=80
      - --innodb-buffer-pool-size=256M
      - --max-allowed-packet=4M
      - --log-bin-trust-function-creators=ON
    volumes:
      - practice_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    restart: unless-stopped
    networks: [database]

  backend:
    build: ./backend
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/setup.ps1 first}
      QUERYLAB_COOKIE_SECURE: ${QUERYLAB_COOKIE_SECURE:-false}
      QUERYLAB_PUBLIC_ORIGIN: ${QUERYLAB_PUBLIC_ORIGIN:-}
      QUERYLAB_SESSION_TTL_SECONDS: ${QUERYLAB_SESSION_TTL_SECONDS:-3600}
      QUERYLAB_MAX_SESSIONS: ${QUERYLAB_MAX_SESSIONS:-10}
      QUERYLAB_SQL_TIMEOUT_SECONDS: ${QUERYLAB_SQL_TIMEOUT_SECONDS:-8}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped
    networks: [database, web]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${QUERYLAB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    networks: [web]

networks:
  database:
    internal: true
  web:

volumes:
  practice_mysql:

